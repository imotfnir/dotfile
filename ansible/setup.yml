- name: System setup
  hosts: all
  vars_files:
    - vars.yml
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      become: yes
      ignore_errors: yes
      tags: apt

    - name: Install git
      ansible.builtin.package:
        name: git
        state: present
      become: yes
      register: git_install_result
      ignore_errors: yes
      tags: git

    - name: Install go
      ansible.builtin.package:
        name: golang
        state: present
      become: yes
      register: go_install_result
      ignore_errors: yes
      tags: go

    - name: Install snap
      ansible.builtin.package:
        name:
          - snap
          - snapd
        state: present
      become: yes
      register: snap_install_result
      ignore_errors: yes
      tags: snap

    - name: Install rust
      ansible.builtin.package:
        name:
          - cargo
        state: present
      become: yes
      register: rust_install_result
      ignore_errors: yes
      tags: rust

    - name: Install basic tools
      ansible.builtin.package:
        name:
          - eza
          - tmux
          - vim
          - neovim
          - htop
          - btop
          - ranger
          - trash-cli
          - wireguard
          - ripgrep
          - tmuxinator
          - iftop
          - lua5.4
          - fd-find
          - fzf
          - autojump
          - zoxide
          - timg
          - p7zip-full
          - p7zip-rar
          - traceroute
          - xorg
          - nmap
          - bat
          - git-delta
          - duf
        state: present
      become: yes
      ignore_errors: yes
      tags: tools

    - name: Install LSP tools
      ansible.builtin.package:
        name:
          - shfmt
          - shellcheck
          - clangd
          - clang-format
        state: present
      become: yes
      ignore_errors: yes
      tags: lsp

    - name: Install Miniconda
      ansible.builtin.import_tasks: tasks/conda.yml
      become: no
      ignore_errors: yes
      register: conda_install_result
      tags: conda

    - name: Install pip, python
      ansible.builtin.package:
        name:
          - python3
          - python3-pip
      become: yes
      ignore_errors: yes
      register: python_install_result
      when: conda_install_result.failed
      tags: python

    - name: Install go-tools
      ansible.builtin.import_tasks: tasks/go_tools.yml
      become: no
      when: not go_install_result.failed
      tags: go

    - name: Install rust-tools
      ansible.builtin.import_tasks: tasks/rust_tools.yml
      become: no
      when: not rust_install_result.failed
      tags: rust

    - name: Install my-dotfile
      ansible.builtin.import_tasks: tasks/my-dotfile.yml
      become: no
      tags: my
