services:
  nginx:
    image: nginx:latest
    container_name: nginx
    network_mode: "host"
    volumes:
      - ./nginx:/etc/nginx:ro
      - ${HOME_DIR}/.acme.sh:/etc/letsencrypt:ro
      - ${DOCKER_DATA_DIR}/nginx:/usr/share/nginx
    restart: unless-stopped

  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    volumes:
      - ${NGINX_LOGS_DIR}:/var/log/nginx/:ro
      - ${DOCKER_DATA_DIR}/nginx:/data
    environment:
      - LANG=en_US.UTF-8
    network_mode: "host"
    restart: unless-stopped
    command:
      - "/var/log/nginx/access.log"
      - "-a"
      - "--output=/data/html/access_report.html"
      - "--log-format=COMBINED"
      - "--real-time-html"
      - "--port=7891"
      - "--persist"
      - "--restore"
